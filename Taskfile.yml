# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
set: [pipefail]
vars:
  # Each dir under clusters/ is a cluster whose kube context has the same name.
  # Override to target a subset: task diff CLUSTERS=yggdrasil
  CLUSTERS:
    sh: find clusters -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
  # Every dir with a kustomization.yaml (infrastructure/*, apps/*, and their children)
  KUSTOMIZE_DIRS:
    sh: find . -name kustomization.yaml -not -path './.git/*' -printf '%h\n' | sort
env:
  # The backticks stop Task from expanding kubeconform's own {{.Group}} placeholders
  KUBECONFORM_FLAGS: >-
    -strict -skip Secret,CustomResourceDefinition -summary -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{`{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}`}}.json
tasks:
  install-deps:
    desc: Install dependencies
    cmds:
      - brew install helm kubeconform fluxcd/tap/flux controlplaneio-fluxcd/tap/flux-operator kubectx age sops
      - go install github.com/google/yamlfmt/cmd/yamlfmt@latest
      - git config core.hooksPath .githooks
  bootstrap:
    desc: Bootstrap the Flux system on the cluster. Requires the age secret key
    cmds:
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create secret generic sops-age -n flux-system --from-file=age.agekey=$HOME/.config/sops/age/keys.txt
      - helm upgrade --install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator --namespace flux-system
      - kubectl apply -f clusters/{{.CLUSTER}}/flux-instance.yaml
    preconditions:
      - sh: test -f age.agekey
        msg: "age.agekey not found in repo root"
  format:
    desc: Format yaml
    cmd: yamlfmt .
  validate:
    desc: Offline checks for every cluster dir and kustomize root
    cmds:
      - for: {var: CLUSTERS}
        cmd: kubeconform $KUBECONFORM_FLAGS clusters/{{.ITEM}}
      - for: {var: CLUSTERS}
        cmd: flux-operator build instance -f clusters/{{.ITEM}}/flux-instance.yaml > /dev/null
      - for: {var: KUSTOMIZE_DIRS}
        cmd: kubectl kustomize {{.ITEM}} | kubeconform $KUBECONFORM_FLAGS
  diff:
    desc: Diff the local tree against each live cluster (server-side dry run)
    cmds:
      # flux diff exits 1 when there are changes, >1 on errors; only the latter should fail
      - for: {var: CLUSTERS}
        cmd: flux diff ks flux-system --context {{.ITEM}} --path clusters/{{.ITEM}} --recursive --local-sources GitRepository/flux-system/flux-system=. || [ $? -eq 1 ]
  reconcile:
    desc: Pull the latest commit and reconcile each cluster now
    cmds:
      - for: {var: CLUSTERS}
        cmd: flux reconcile ks flux-system --with-source --context {{.ITEM}}
      - task: status
  status:
    desc: Show Flux Kustomizations and HelmReleases on each cluster
    cmds:
      - for: {var: CLUSTERS}
        cmd: flux get ks --context {{.ITEM}} && flux get hr -A --context {{.ITEM}}
  export-public-cert:
    desc: Export public certificate
    cmds:
      - kubectl -n cert-manager get secret yggdrasil-ca -o jsonpath='{.data.ca\.crt}' | base64 -d > yggdrasil-ca.crt
  suspend:
    desc: "Break-glass: suspend all Flux Kustomizations and HelmReleases"
    silent: true
    cmds:
      - flux suspend ks --all -n flux-system
      - |
        for ns in $(kubectl get hr -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' | sort -u); do
          flux suspend hr --all -n "$ns"
        done
      - task: suspended
  resume:
    desc: Resume everything `task suspend` paused
    silent: true
    cmds:
      - |
        for ns in $(kubectl get hr -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' | sort -u); do
          flux resume hr --all -n "$ns" --wait=false
        done
      - flux resume ks --all -n flux-system --wait=false
      - task: suspended
  suspended:
    desc: List suspended Flux resources
    silent: true
    cmds:
      - |
        kubectl get \
          kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io,gitrepositories.source.toolkit.fluxcd.io,helmrepositories.source.toolkit.fluxcd.io,ocirepositories.source.toolkit.fluxcd.io \
          -A -o jsonpath='{range .items[?(@.spec.suspend==true)]}{.kind}{"\t"}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' \
          | column -t

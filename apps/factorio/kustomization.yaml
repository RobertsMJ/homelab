apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factorio
resources:
  - ./namespace.yaml
  - ./server-password.sops.yaml
  - ./server-rcon-password.sops.yaml
  - ./account.sops.yaml
  - ./repository.yaml
  - ./release.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: factorio-map-settings
    files:
      - values.yaml=deathworld_railworld_map_settings.yaml
configurations:
  - ./kustomizeconfig.yaml

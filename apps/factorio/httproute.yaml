apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factorio
  namespace: factorio
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - factorio.yggdrasil.home
  rules:
    - backendRefs:
        - name: factorio
          port: 31497
      matches:
        - path:
            type: PathPrefix
            value: /

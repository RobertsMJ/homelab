apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: factorio
  namespace: factorio
spec:
  interval: 1h
  chart:
    spec:
      chart: factorio-server-charts
      version: "2.5.x"
      sourceRef:
        kind: HelmRepository
        name: factorio
  valuesFrom:
    - kind: ConfigMap
      name: factorio-map-settings
  values:
    image:
      repository: "factoriotools/factorio"
      tag: "stable-2.1.24"
    fullnameOverride: factorio
    resources:
      requests:
        cpu: 1
        memory: 1Gi
    account:
      accountSecret: factorio-account
    factorioServer:
      save_name: "da_factory"
      generate_new_save: true
      load_latest_save: true
    server_settings:
      name: "Chip's factorio server"
      description: "Factorio running on yggdrasil"
      require_user_verification: true
    serverPassword:
      passwordSecret: server-password
    rcon:
      passwordSecret: server-rcon-password
      external: false
    admin_list:
      - old_chip

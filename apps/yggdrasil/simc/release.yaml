apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simc
  namespace: simc
spec:
  interval: 30m
  chart:
    spec:
      chart: simc
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: simc
  values:
    gateway:
      hostnames:
        - simc.yggdrasil.home
      parentRefs:
        - name: shared-gateway
          namespace: gateway
          sectionName: https
    apps:
      run-sim:
        # Ubuntu 26.04 stacks container AppArmor labels, so the default profile denies
        # in-container signals and run-sim can't kill simc. Drop once k3s ships
        # the containerd fix: https://github.com/containerd/containerd/issues/14485
        securityContext:
          appArmorProfile:
            type: Unconfined

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simc
  namespace: simc
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: simc
  values:
    gateway:
      hostnames:
        - simc.yggdrasil.home
      parentRefs:
        - name: shared-gateway
          namespace: gateway
          sectionName: https

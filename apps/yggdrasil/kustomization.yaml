apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ./factorio
  - ./simc
patches:
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: nui
        namespace: nats
      spec:
        hostnames:
          - nui.yggdrasil.home
  - patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: simc
        namespace: simc
      spec:
        podSecurityContext:
          runAsUser: 26
          runAsGroup: 26
          fsGroup: 26
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: Unconfined

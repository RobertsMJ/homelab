apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ./factorio
  - ./simc
patches:
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: nui
        namespace: nats
      spec:
        hostnames:
          - nui.yggdrasil.home

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nui
  namespace: nats
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - nui.yggdrasil.home
  rules:
    - backendRefs:
        - name: nui
          port: 31311
      matches:
        - path:
            type: PathPrefix
            value: /

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scylla
resources:
  # Must match simc/scylla-owner.sops.yaml, which the app logs in with; a mismatch shows up as auth failures in simc, not here
  - ./owner.sops.yaml
  - ./job.yaml
# The hash suffix changes the Job's pod template whenever the script changes, so Flux recreates and reruns it
configMapGenerator:
  - name: simc-keyspace-script
    files:
      - ./provision.sh

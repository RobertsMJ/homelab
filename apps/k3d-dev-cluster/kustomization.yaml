apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The simc app is deployed from the simc-cloud working tree; Flux only supplies its namespace and credentials
resources:
  - ../base
  - ./simc
patches:
  - target:
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: http
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: nui
        namespace: nats
      spec:
        hostnames:
          - nui.k3d.localhost

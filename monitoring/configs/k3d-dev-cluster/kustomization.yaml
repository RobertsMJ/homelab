apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: http
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: monitoring
      spec:
        hostnames:
          - grafana.k3d.localhost
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: prometheus
        namespace: monitoring
      spec:
        hostnames:
          - prometheus.k3d.localhost

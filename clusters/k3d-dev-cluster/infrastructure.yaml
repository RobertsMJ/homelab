apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/crds
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-crds
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/k3d-dev-cluster
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/k3d-dev-cluster
  # The default health check passes while the operator is still adding nodes; dependents need the whole cluster
  healthCheckExprs:
    - apiVersion: scylla.scylladb.com/v1
      kind: ScyllaCluster
      current: >-
        status.observedGeneration == metadata.generation && status.conditions.exists(c, c.type == 'Available' && c.status == 'True') && status.conditions.exists(c, c.type == 'Progressing' && c.status == 'False')
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  wait: true

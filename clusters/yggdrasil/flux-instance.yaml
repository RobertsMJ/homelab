apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.9.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - source-watcher
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    size: small
  sync:
    kind: GitRepository
    url: "https://github.com/RobertsMJ/homelab.git"
    ref: "refs/heads/main"
    path: "clusters/yggdrasil"

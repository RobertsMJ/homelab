apiVersion: v1
kind: ConfigMap
metadata:
  name: scylladb-config
  namespace: scylla
data:
  scylla.yaml: |
    authenticator: PasswordAuthenticator
    authorizer: CassandraAuthorizer
---
apiVersion: scylla.scylladb.com/v1
kind: ScyllaCluster
metadata:
  name: dev-cluster
  namespace: scylla
spec:
  # renovate: datasource=docker depName=scylladb/scylla
  version: 2026.3.6
  # renovate: datasource=docker depName=scylladb/scylla-manager-agent
  agentVersion: 3.13.0
  developerMode: true
  datacenter:
    name: dev
    racks:
      - name: rack1
        members: 1
        scyllaConfig: scylladb-config
        storage:
          capacity: 1Gi
          storageClassName: local-path
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 1Gi
      - name: rack2
        members: 1
        scyllaConfig: scylladb-config
        storage:
          capacity: 1Gi
          storageClassName: local-path
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 1Gi
      - name: rack3
        members: 1
        scyllaConfig: scylladb-config
        storage:
          capacity: 1Gi
          storageClassName: local-path
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 1Gi

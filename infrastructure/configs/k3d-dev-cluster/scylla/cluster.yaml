apiVersion: v1
kind: ConfigMap
metadata:
  name: scylladb-config
  namespace: scylla
data:
  # auth_superuser_* only applies when the auth tables are first created; changing it later needs a wiped cluster.
  # The hash is of a random 32-character password, so publishing it doesn't make it guessable.
  # It must match the password in superuser.sops.yaml; regenerate it from there with:
  #   sops -d --extract '["stringData"]["password"]' superuser.sops.yaml | openssl passwd -6 -stdin
  # Rotating the admin password is manual, since GitOps can only set it at bootstrap:
  #   1. ALTER ROLE admin WITH PASSWORD '<new>'; in cqlsh, logged in as admin
  #   2. sops edit superuser.sops.yaml to set <new>, regenerate the hash above, and commit both together.
  #      simc-keyspace fails auth until this lands, since it logs in with the Secret.
  scylla.yaml: |
    authenticator: PasswordAuthenticator
    authorizer: CassandraAuthorizer
    auth_superuser_name: admin
    auth_superuser_salted_password: "$6$JmJJWnY8HOuHCcrz$XJb3iGyW9wgygrO9kGkKXwZ7wajObjRGrzHK1Edewhm0PCA9955uVf43VbSD1//FJWO4uFZC68O5oCLrlfdx4."
---
apiVersion: scylla.scylladb.com/v1
kind: ScyllaCluster
metadata:
  name: dev-cluster
  namespace: scylla
spec:
  # renovate: datasource=docker depName=scylladb/scylla
  version: 2026.3.6
  # renovate: datasource=docker depName=scylladb/scylla-manager-agent
  agentVersion: 3.13.0
  developerMode: true
  datacenter:
    name: dev
    racks:
      - name: rack1
        members: 1
        scyllaConfig: scylladb-config
        storage:
          capacity: 1Gi
          storageClassName: local-path
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 1Gi

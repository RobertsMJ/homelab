apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-tls
        namespace: gateway
      spec:
        dnsNames:
          - yggdrasil.home
          - "*.yggdrasil.home"
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: flux-web
        namespace: flux-system
      spec:
        hostnames:
          - flux.yggdrasil.home
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: kiali
        namespace: istio-system
      spec:
        hostnames:
          - kiali.yggdrasil.home

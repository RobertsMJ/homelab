apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kiali-operator
        namespace: kiali-operator
      spec:
        values:
          cr:
            spec:
              external_services:
                grafana:
                  external_url: https://grafana.yggdrasil.home

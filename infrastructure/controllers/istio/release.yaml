apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 1h
  chart:
    spec:
      chart: base
      version: "1.30.x"
      sourceRef:
        kind: HelmRepository
        name: istio
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 1h
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.30.x"
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
    global:
      platform: k3s
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  interval: 1h
  dependsOn:
    - name: istiod
  chart:
    spec:
      chart: cni
      version: "1.30.x"
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
    global:
      platform: k3s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  interval: 1h
  dependsOn:
    - name: istiod
    - name: istio-cni
  chart:
    spec:
      chart: ztunnel
      version: "1.30.x"
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

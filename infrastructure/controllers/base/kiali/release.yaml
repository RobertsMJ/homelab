apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali-operator
  namespace: kiali-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: kiali-operator
      version: "2.34.x"
      sourceRef:
        kind: HelmRepository
        name: kiali
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    cr:
      create: true
      namespace: istio-system
      spec:
        auth:
          strategy: anonymous
        deployment:
          view_only_mode: true
        external_services:
          grafana:
            internal_url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
          prometheus:
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.x"
      sourceRef:
        kind: HelmRepository
        name: cnpg
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
